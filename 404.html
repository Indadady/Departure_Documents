<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단축 링크 연결 중… | 투어메이커</title>
    <meta name="robots" content="noindex">
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#eef2f6; color:#334155; }
        .box { text-align:center; padding:2rem; max-width:28rem; }
        a { color:#004098; font-weight:bold; }
        .muted { color:#64748b; font-size:0.875rem; line-height:1.5; margin-top:0.75rem; }
    </style>
</head>
<body>
    <div class="box">
        <p id="msg">단축 주소로 서류함을 찾는 중…</p>
        <p id="fallback" class="muted"></p>
    </div>
    <script>
        (function () {
            var msg = document.getElementById('msg');
            var fallback = document.getElementById('fallback');
            var parts = location.pathname.split('/').filter(Boolean);
            // Project Pages: /Departure_Documents/{slug}/...
            var docsIdx = parts.indexOf('Departure_Documents');
            var slug = '';
            if (docsIdx >= 0 && parts[docsIdx + 1]) {
                slug = parts[docsIdx + 1];
            } else if (parts.length) {
                slug = parts[parts.length - 1];
            }
            slug = (slug || '').replace(/\/+$/, '');
            if (!slug || slug === '404.html' || slug === 'Departure_Documents') {
                msg.textContent = '단축 주소를 확인할 수 없습니다.';
                return;
            }

            var basePath = docsIdx >= 0
                ? '/' + parts.slice(0, docsIdx + 1).join('/') + '/'
                : './';

            function go(school, program, pwd) {
                var url = new URL(basePath, location.origin);
                url.searchParams.set('school', school);
                url.searchParams.set('program', program || '국외현장체험학습');
                if (pwd) url.searchParams.set('pwd', btoa(String(pwd)));
                fallback.innerHTML = '<a href="' + url.href.replace(/"/g, '&quot;') + '">자동 이동되지 않으면 여기를 눌러주세요</a>';
                location.replace(url.href);
            }

            fetch(basePath + 'schools.json?t=' + Date.now())
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    var list = (data && data.schools) || [];
                    var found = null;
                    for (var i = 0; i < list.length; i++) {
                        var sp = String(list[i].shortPath || '').replace(/^\/+|\/+$/g, '');
                        if (sp === slug) { found = list[i]; break; }
                    }
                    if (!found) {
                        msg.textContent = '등록되지 않은 단축 주소입니다: ' + slug;
                        fallback.textContent = '관리자 화면에서 단축 링크를 다시 생성하거나, schools.json에 shortPath를 등록해 주세요.';
                        return;
                    }
                    go(found.school, found.program, found.pwd);
                })
                .catch(function () {
                    msg.textContent = '학교 목록을 불러오지 못했습니다.';
                });
        })();
    </script>
</body>
</html>
